<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poor Man's Cuebids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --felt: #163427;
  --felt-dark: #0f2419;
  --cream: #f6f1e4;
  --cream-dim: #e9e1cb;
  --brass: #c69a3a;
  --brass-bright: #e4b653;
  --ink: #1c1c1c;
  --red: #a13a3a;
  --black: #1c1c1c;
  --line: rgba(198, 154, 58, 0.35);
  --font-display: 'Fraunces', serif;
  --font-body: 'Source Sans 3', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, rgba(255,255,255,0.05), transparent 60%),
    var(--felt);
  background-image:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03) 0, transparent 40%),
    linear-gradient(160deg, var(--felt) 0%, var(--felt-dark) 100%);
  color: var(--cream);
  font-family: var(--font-body);
}

#app { min-height: 100vh; display: flex; flex-direction: column; }

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-suits i { font-style: normal; margin-right: 2px; font-size: 0.85em; }
.brand-suits .s, .brand-suits .c { color: var(--cream); }
.brand-suits .h, .brand-suits .d { color: #c96a6a; }
.brand-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.4rem;
  letter-spacing: 0.01em;
  color: var(--brass-bright);
}

.session-meta { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
.code-pill {
  font-family: var(--font-mono);
  background: rgba(198,154,58,0.15);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 0.08em;
  color: var(--brass-bright);
}
.code-pill.big { font-size: 1.3rem; padding: 8px 16px; }

.link-btn {
  background: none; border: none; color: var(--cream-dim);
  text-decoration: underline; cursor: pointer; font-size: 0.85rem;
  font-family: var(--font-body);
}
.link-btn:hover { color: var(--brass-bright); }

main#view { flex: 1; display: flex; justify-content: center; padding: 32px 20px 60px; }

/* ---------- landing ---------- */
.landing { max-width: 440px; width: 100%; }
.tagline {
  font-family: var(--font-display);
  font-size: 1.15rem;
  color: var(--cream-dim);
  text-align: center;
  margin-bottom: 28px;
  font-weight: 500;
}
.tabs { display: flex; gap: 2px; margin-bottom: 20px; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 4px; }
.tab-btn {
  flex: 1; padding: 10px; background: none; border: none; color: var(--cream-dim);
  cursor: pointer; border-radius: 6px; font-family: var(--font-body); font-weight: 600; font-size: 0.92rem;
}
.tab-btn.active { background: var(--brass); color: var(--felt-dark); }
.pane { display: flex; flex-direction: column; gap: 14px; }
.pane.hidden { display: none; }
.pane label { display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; color: var(--cream-dim); }
.pane input, .pane select {
  background: var(--cream);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 1rem;
  font-family: var(--font-body);
}
button.primary {
  background: var(--brass);
  color: var(--felt-dark);
  border: none;
  padding: 12px;
  border-radius: 6px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 6px;
  transition: background 0.15s;
}
button.primary:hover { background: var(--brass-bright); }

/* ---------- waiting / complete ---------- */
.waiting, .complete { max-width: 480px; text-align: center; margin-top: 40px; }
.waiting h1, .complete h1 { font-family: var(--font-display); color: var(--brass-bright); }
.muted { color: var(--cream-dim); font-size: 0.9rem; }

/* ---------- game ---------- */
.game { width: 100%; max-width: 900px; }
.hand-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 18px; font-size: 0.92rem; color: var(--cream-dim);
}
.set-label { font-family: var(--font-display); color: var(--brass-bright); font-weight: 600; }
.seat-badge strong { color: var(--brass-bright); }

.table-layout {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 18px;
  align-items: start;
}
.left-col { display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 760px) {
  .table-layout { grid-template-columns: 1fr; }
}

.hand-panel {
  background: var(--cream);
  color: var(--ink);
  border-radius: 10px;
  padding: 16px 18px;
  position: relative;
  min-height: 150px;
}
.hand-panel h2 {
  font-family: var(--font-display);
  font-size: 1rem;
  margin: 0 0 10px;
  color: var(--felt);
  border-bottom: 1px solid var(--cream-dim);
  padding-bottom: 6px;
}
.suit-row {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  display: flex;
  gap: 10px;
  padding: 3px 0;
  letter-spacing: 0.03em;
}
.suit-row i { font-style: normal; width: 18px; text-align: center; }
.suit-row .s, .suit-row .c { color: var(--black); }
.suit-row .h, .suit-row .d { color: var(--red); }

.hand-panel.other.blurred .locked {
  display: flex; align-items: center; justify-content: center;
  height: 110px; color: #8a8370; font-size: 0.85rem; text-align: center;
  font-style: italic;
}

.auction-panel {
  background: rgba(0,0,0,0.18);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
}
.auction-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.92rem; }
.auction-table th {
  color: var(--brass-bright); font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--line);
}
.auction-table td { text-align: center; padding: 5px 2px; }
.call.pass { color: var(--cream-dim); font-style: italic; }
.call.dbl { color: var(--brass-bright); font-weight: 700; }
.call.red { color: #d98f8f; font-weight: 600; }
.call.black { color: var(--cream); font-weight: 600; }

.turn-line { text-align: center; margin-top: 10px; font-size: 0.9rem; color: var(--cream-dim); }
.turn-line.mine { color: var(--brass-bright); font-weight: 700; }
.contract-line {
  text-align: center; margin-top: 12px; font-family: var(--font-display);
  font-size: 1.05rem; color: var(--brass-bright);
}

/* ---------- bid box ---------- */
.bid-box { background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.waiting-note { text-align: center; padding: 40px 12px; }
.reveal { display: flex; flex-direction: column; gap: 14px; }
.bid-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.bid-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.bid-btn {
  font-family: var(--font-mono); font-size: 0.95rem; padding: 8px 4px;
  border-radius: 5px; border: 1px solid var(--line); background: var(--cream); cursor: pointer;
}
.bid-btn.red { color: var(--red); }
.bid-btn.black { color: var(--black); }
.bid-btn[disabled] { opacity: 0.25; cursor: not-allowed; }
.bid-actions { display: flex; gap: 10px; }
.action-btn {
  flex: 1; padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: 700;
}
.action-btn.pass { background: var(--cream-dim); color: var(--felt-dark); }
.action-btn.dbl { background: var(--brass); color: var(--felt-dark); }
.action-btn[disabled] { opacity: 0.3; cursor: not-allowed; }

/* ---------- reveal ---------- */
.suggested, .notes {
  background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 14px;
}
.suggested h3, .notes h3 {
  font-family: var(--font-display); margin: 0 0 8px; color: var(--brass-bright); font-size: 0.95rem;
}
.suggested p, .notes p { margin: 0; line-height: 1.5; color: var(--cream-dim); font-family: var(--font-mono); font-size: 0.92rem; }
.notes p { font-family: var(--font-body); }

/* ---------- toast ---------- */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--brass); color: var(--felt-dark); padding: 10px 18px;
  border-radius: 6px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  z-index: 100;
}
.toast.hidden { display: none; }
.hidden { display: none !important; }

</style>
</head>

  <header class="top-bar">
    <div class="brand">

      <span class="brand-name">Poor Man's Cuebids</span>
    </div>
    <div id="sessionMeta" class="session-meta hidden"></div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast hidden"></div>
</div>

// ============ Firebase Realtime Database via plain REST calls ============
// Project: coaching-u26. No SDK, no auth - matches the suit-combinations
// app's working pattern. Rules must allow open access under this path:
//   "bidding_practice": { ".read": true, ".write": true }
const DB_ROOT = "https://coaching-u26-default-rtdb.asia-southeast1.firebasedatabase.app";

async function dbGet(path) {
  const res = await fetch(`${DB_ROOT}/${path}.json`);
  if (!res.ok) throw new Error(`DB read failed (${res.status})`);
  return res.json();
}
async function dbPut(path, value) {
  const res = await fetch(`${DB_ROOT}/${path}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(value),
  });
  if (!res.ok) throw new Error(`DB write failed (${res.status})`);
  return res.json();
}

// ============ bidding auction engine ============
const STRAIN_RANK = { C: 0, D: 1, H: 2, S: 3, N: 4 };
const STRAIN_SYMBOL = { C: '\u2663', D: '\u2666', H: '\u2665', S: '\u2660', N: 'NT' };
const ROTATION_FROM_S = ['S', 'W', 'N', 'E'];
const ROTATION_FROM_E = ['E', 'S', 'W', 'N'];

function seatSide(seat) {
  return (seat === 'S' || seat === 'N') ? 'us' : 'opp';
}
function rotationOrder(dealer) {
  return dealer === 'E' ? ROTATION_FROM_E : ROTATION_FROM_S;
}
function replay(dealer, tokens) {
  let level = null, strain = null, side = null, doubled = 'none';
  let passStreak = 0;
  for (const t of tokens) {
    const call = t.call;
    if (call === 'P') { passStreak += 1; continue; }
    passStreak = 0;
    if (call === 'X') { doubled = 'X'; continue; }
    if (call === 'XX') { doubled = 'XX'; continue; }
    level = parseInt(call[0], 10);
    strain = call[1];
    side = seatSide(t.seat);
    doubled = 'none';
  }
  return { level, strain, side, doubled, passStreak };
}
function initAuctionState(hand) {
  const dealer = hand.dealer;
  const order = rotationOrder(dealer);
  const thusFar = hand.thusFar.map((t) => ({ seat: t.seat, call: t.call, isOpp: t.isOpp }));
  let ptr = thusFar.length;
  const full = thusFar.slice();
  while (seatSide(order[ptr % 4]) === 'opp') {
    full.push({ seat: order[ptr % 4], call: 'P', isOpp: true, implicit: true });
    ptr += 1;
  }
  const turnSeat = order[ptr % 4];
  const r = replay(dealer, full);
  return {
    dealer, order, full, liveCalls: [], turnSeat, ptr,
    contract: { level: r.level, strain: r.strain, side: r.side, doubled: r.doubled },
    passStreak: r.passStreak,
    over: r.passStreak >= 3,
  };
}
function legalCalls(state) {
  if (state.over) return { pass: false, double: false, redouble: false, contract: state.contract };
  const c = state.contract;
  const mySide = seatSide(state.turnSeat);
  const canDouble = c.level !== null && c.side !== mySide && c.doubled === 'none';
  const canRedouble = c.level !== null && c.side !== mySide && c.doubled === 'X';
  return { pass: true, double: canDouble, redouble: canRedouble, contract: c };
}
function isBidHigher(level, strain, contract) {
  if (contract.level === null) return true;
  const a = [level, STRAIN_RANK[strain]];
  const b = [contract.level, STRAIN_RANK[contract.strain]];
  return a[0] > b[0] || (a[0] === b[0] && a[1] > b[1]);
}
function applyLiveCall(state, call) {
  if (state.over) throw new Error('Auction already over');
  const seat = state.turnSeat;
  const legal = legalCalls(state);
  if (call === 'P' && !legal.pass) throw new Error('Pass not legal');
  if (call === 'X' && !legal.double) throw new Error('Double not legal');
  if (call === 'XX' && !legal.redouble) throw new Error('Redouble not legal');
  if (!['P', 'X', 'XX'].includes(call)) {
    const level = parseInt(call[0], 10);
    const strain = call[1];
    if (!isBidHigher(level, strain, state.contract)) throw new Error('Bid too low');
  }
  const wasPartnerNonPass = state.liveCalls.length > 0 &&
    state.liveCalls[state.liveCalls.length - 1].call !== 'P';
  const newLiveCalls = state.liveCalls.concat([{ seat, call }]);
  const newFull = state.full.concat([{ seat, call, isOpp: false, implicit: false }]);
  let ptr = state.ptr + 1;
  const order = state.order;
  const oppSeat = order[ptr % 4];
  newFull.push({ seat: oppSeat, call: 'P', isOpp: true, implicit: true });
  ptr += 1;
  const nextTurnSeat = order[ptr % 4];
  const r = replay(state.dealer, newFull);
  const over = r.passStreak >= 3;
  return {
    ...state, full: newFull, liveCalls: newLiveCalls, turnSeat: nextTurnSeat, ptr,
    contract: { level: r.level, strain: r.strain, side: r.side, doubled: r.doubled },
    passStreak: r.passStreak, over,
    endedByPartnerPass: call === 'P' && wasPartnerNonPass && over,
  };
}
function formatContract(contract) {
  if (contract.level === null) return 'Passed out';
  const dbl = contract.doubled === 'X' ? ' X' : contract.doubled === 'XX' ? ' XX' : '';
  return `${contract.level}${STRAIN_SYMBOL[contract.strain]}${dbl} by ${contract.side === 'us' ? 'us' : 'opponents'}`;
}


// ============ app ============
const viewEl = document.getElementById('view');
const sessionMetaEl = document.getElementById('sessionMeta');
const toastEl = document.getElementById('toast');
const STORAGE_KEY = 'bridgePracticeSession';
const POLL_MS = 2000;

let pollTimer = null;
let lastSeenJson = null;

function toast(msg, ms = 3200) {
  toastEl.textContent = msg;
  toastEl.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.add('hidden'), ms);
}
function saveLocal(code, name) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ code, name }));
}
function loadLocal() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
}
function clearLocal() { localStorage.removeItem(STORAGE_KEY); }

function getHand(setId, num) {
  const set = HANDS_DATA.sets.find((s) => slugify(s.name) === setId);
  return set ? set.hands.find((h) => h.num === num) : null;
}
function slugify(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}
function pairKey(nameA, nameB) {
  const pair = [slugify(nameA), slugify(nameB)].sort();
  return `${pair[0]}--${pair[1]}`;
}

// ---------- boot ----------
const saved = loadLocal();
if (saved) {
  enterGame(saved.code, saved.name);
} else {
  renderLanding();
}

// ---------- landing ----------
function renderLanding() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  sessionMetaEl.classList.add('hidden');
  viewEl.innerHTML = `
    <div class="landing">
      <section class="pane">
        <label>Your name<input id="myName" type="text" maxlength="30" placeholder="e.g. Alice"></label>
        <label>Partner's name<input id="partnerName" type="text" maxlength="30" placeholder="e.g. Bob"></label>
        <label>Set to practice <span class="muted">(each set keeps its own separate progress for you two)</span>
          <select id="setSelect">${HANDS_DATA.sets.map((s) => `<option value="${slugify(s.name)}">${s.name} (${s.hands.length} hands)</option>`).join('')}</select>
        </label>
        <button id="goBtn" class="primary">Continue</button>
      </section>
    </div>
  `;

  document.getElementById('goBtn').addEventListener('click', async () => {
    const myName = document.getElementById('myName').value.trim();
    const partnerName = document.getElementById('partnerName').value.trim();
    const setId = document.getElementById('setSelect').value;
    if (!myName || !partnerName) return toast('Enter both names.');
    if (myName.toLowerCase() === partnerName.toLowerCase()) return toast('Names must be different.');

    const set = HANDS_DATA.sets.find((s) => slugify(s.name) === setId);
    if (!set) return toast('Choose a set.');

    const key = `${pairKey(myName, partnerName)}--${setId}`;
    const existing = await dbGet(`bidding_practice/${key}`).catch(() => null);

    if (existing) {
      saveLocal(key, myName);
      return enterGame(key, myName);
    }

    await dbPut(`bidding_practice/${key}`, {
      hostName: myName, partnerName,
      setId, setName: set.name,
      handNums: set.hands.map((h) => h.num),
      currentPos: 0,
      createdAt: Date.now(),
      hands: {},
    });
    saveLocal(key, myName);
    enterGame(key, myName);
  });
}

// ---------- game (polling-based sync) ----------
function enterGame(code, myName) {
  sessionMetaEl.classList.remove('hidden');
  sessionMetaEl.innerHTML = `<button id="leaveBtn" class="link-btn">Leave session</button>`;
  document.getElementById('leaveBtn').addEventListener('click', () => {
    clearLocal();
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    renderLanding();
  });

  lastSeenJson = null;
  const tick = async () => {
    const session = await dbGet(`bidding_practice/${code}`).catch(() => null);
    if (!session) {
      toast('Session no longer exists.');
      clearLocal();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      return renderLanding();
    }
    const json = JSON.stringify(session);
    if (json === lastSeenJson) return; // nothing changed, skip re-render
    lastSeenJson = json;
    renderHandForSession(code, session, myName);
  };
  tick();
  pollTimer = setInterval(tick, POLL_MS);
}

function renderHandForSession(code, session, myName) {
  const { handNums, currentPos, setId, setName, hostName, partnerName } = session;

  if (currentPos >= handNums.length) {
    viewEl.innerHTML = `
      <div class="complete">
        <h1>Set complete</h1>
        <p>You and ${myName === hostName ? partnerName : hostName} finished every hand in "${setName}".</p>
        <button id="backBtn" class="primary">Back to start</button>
      </div>`;
    document.getElementById('backBtn').addEventListener('click', () => {
      clearLocal();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      renderLanding();
    });
    return;
  }

  const hostSeat = currentPos % 2 === 0 ? 'S' : 'N';
  const mySeat = myName.toLowerCase() === hostName.toLowerCase() ? hostSeat : (hostSeat === 'S' ? 'N' : 'S');
  const otherName = myName.toLowerCase() === hostName.toLowerCase() ? partnerName : hostName;
  const sName = hostSeat === 'S' ? hostName : partnerName;
  const nName = hostSeat === 'N' ? hostName : partnerName;

  const num = handNums[currentPos];
  const hand = getHand(setId, num);
  const hs = (session.hands && session.hands[currentPos]) || { liveCalls: [], revealed: false };

  const state = computeAuction(hand, hs.liveCalls || []);
  const isMyTurn = !state.over && state.turnSeat === mySeat;

  if (state.over && !hs.revealed) {
    dbPut(`bidding_practice/${code}/hands/${currentPos}/revealed`, true).catch(() => {});
  }

  const northVisible = mySeat === 'N' || state.over;
  const southVisible = mySeat === 'S' || state.over;
  const northLabel = mySeat === 'N' ? `${nName} (you)` : nName;
  const southLabel = mySeat === 'S' ? `${sName} (you)` : sName;

  viewEl.innerHTML = `
    <div class="game">
      <div class="hand-header">
        <div><span class="set-label">${setName}</span> &middot; hand ${currentPos + 1} of ${handNums.length}</div>
        <div class="seat-badge">You are <strong>${mySeat === 'S' ? 'South' : 'North'}</strong></div>
      </div>

      <div class="table-layout">
        <div class="left-col">
          <div class="hand-panel ${mySeat === 'N' ? 'mine' : 'other'} ${northVisible ? '' : 'blurred'}">
            <h2>North &mdash; ${northLabel}</h2>
            ${northVisible ? renderHandSuits(hand.nHand) : `<div class="locked">Revealed once the auction ends</div>`}
          </div>

          <div class="auction-panel">
            <table class="auction-table">
              <thead><tr><th>N</th><th>E</th><th>S</th><th>W</th></tr></thead>
              <tbody>${renderAuctionRows(state.full)}</tbody>
            </table>
            ${state.over
              ? `<div class="contract-line">${formatContract(state.contract)}</div>`
              : isMyTurn
                ? `<div class="turn-line mine">Your bid</div>`
                : `<div class="turn-line">Waiting for ${otherName}&hellip;</div>`
            }
          </div>

          <div class="hand-panel ${mySeat === 'S' ? 'mine' : 'other'} ${southVisible ? '' : 'blurred'}">
            <h2>South &mdash; ${southLabel}</h2>
            ${southVisible ? renderHandSuits(hand.sHand) : `<div class="locked">Revealed once the auction ends</div>`}
          </div>
        </div>

        <div class="right-col">
          ${state.over
            ? renderReveal(hand)
            : isMyTurn
              ? renderBidBox(state)
              : `<p class="muted waiting-note">Waiting for ${otherName} to bid.</p>`
          }
        </div>
      </div>
    </div>
  `;

  if (isMyTurn) wireBidBox(code, currentPos, hs, state);
  if (state.over) wireReveal(code, currentPos);
}

function computeAuction(hand, liveCalls) {
  let state = initAuctionState(hand);
  for (const c of liveCalls) state = applyLiveCall(state, c.call);
  return state;
}

function renderHandSuits(h) {
  return `
    <div class="suit-row"><i class="s">&spades;</i>${h.S || '&mdash;'}</div>
    <div class="suit-row"><i class="h">&hearts;</i>${h.H || '&mdash;'}</div>
    <div class="suit-row"><i class="d">&diams;</i>${h.D || '&mdash;'}</div>
    <div class="suit-row"><i class="c">&clubs;</i>${h.C || '&mdash;'}</div>
  `;
}

function renderAuctionRows(full) {
  const seatCol = { N: 0, E: 1, S: 2, W: 3 };
  const rows = [];
  let row = [null, null, null, null];
  let started = false;
  for (const call of full) {
    const col = seatCol[call.seat];
    if (!started) {
      for (let c = 0; c < col; c++) row[c] = '';
      started = true;
    }
    row[col] = formatCallHtml(call.call);
    if (col === 3) { rows.push(row); row = [null, null, null, null]; }
  }
  if (row.some((c) => c !== null)) {
    for (let c = 0; c < 4; c++) if (row[c] === null) row[c] = '';
    rows.push(row);
  }
  return rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
}

function formatCallHtml(call) {
  if (call === 'P') return '<span class="call pass">Pass</span>';
  if (call === 'X') return '<span class="call dbl">X</span>';
  if (call === 'XX') return '<span class="call dbl">XX</span>';
  const strain = call[1];
  const cls = strain === 'H' || strain === 'D' ? 'red' : 'black';
  return `<span class="call ${cls}">${call[0]}${STRAIN_SYMBOL[strain]}</span>`;
}

function renderBidBox(state) {
  const legal = legalCalls(state);
  const strains = ['C', 'D', 'H', 'S', 'N'];
  let grid = '';
  for (let level = 1; level <= 7; level++) {
    grid += `<div class="bid-row">`;
    for (const st of strains) {
      const call = `${level}${st}`;
      const disabled = !isCallLegal(call, state) ? 'disabled' : '';
      const cls = st === 'H' || st === 'D' ? 'red' : 'black';
      grid += `<button class="bid-btn ${cls}" data-call="${call}" ${disabled}>${level}${STRAIN_SYMBOL[st]}</button>`;
    }
    grid += `</div>`;
  }
  return `
    <div class="bid-box">
      <div class="bid-grid">${grid}</div>
      <div class="bid-actions">
        <button class="action-btn pass" data-call="P">Pass</button>
        <button class="action-btn dbl" data-call="X" ${legal.double ? '' : 'disabled'}>Double</button>
        <button class="action-btn dbl" data-call="XX" ${legal.redouble ? '' : 'disabled'}>Redouble</button>
      </div>
    </div>
  `;
}

function isCallLegal(call, state) {
  const c = state.contract;
  if (c.level === null) return true;
  const rank = { C: 0, D: 1, H: 2, S: 3, N: 4 };
  const level = parseInt(call[0], 10), strain = call[1];
  return level > c.level || (level === c.level && rank[strain] > rank[c.strain]);
}

function wireBidBox(code, pos, hs, state) {
  document.querySelectorAll('.bid-btn:not([disabled]), .action-btn:not([disabled])').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const call = btn.dataset.call;
      document.querySelectorAll('.bid-btn, .action-btn').forEach((b) => b.disabled = true);
      try {
        // re-fetch immediately before writing to avoid clobbering a
        // concurrent call (best-effort - not a true transaction, but
        // fine for two players alternating strict turns)
        const fresh = await dbGet(`bidding_practice/${code}/hands/${pos}`).catch(() => null);
        const currentLive = (fresh && fresh.liveCalls) || [];
        if (currentLive.length !== (hs.liveCalls || []).length) {
          lastSeenJson = null; // force next poll to re-render with the real state
          return;
        }
        const sName = hs.sName, nName = hs.nName;
        await dbPut(`bidding_practice/${code}/hands/${pos}`, {
          sName, nName,
          liveCalls: [...currentLive, { seat: state.turnSeat, call }],
          revealed: false,
        });
        lastSeenJson = null; // force immediate re-render on next tick
      } catch (e) {
        toast('Could not submit that call - try again.');
      }
    });
  });
}

function renderReveal(hand) {
  return `
    <div class="reveal">
      ${hand.suggested ? `<div class="suggested"><h3>Suggested sequence</h3><p>${escapeHtml(hand.suggested)}</p></div>` : ''}
      ${hand.notes ? `<div class="notes"><h3>Notes</h3><p>${escapeHtml(hand.notes)}</p></div>` : ''}
      <button id="nextHandBtn" class="primary">Next hand</button>
    </div>
  `;
}

function wireReveal(code, currentPos) {
  const btn = document.getElementById('nextHandBtn');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const fresh = await dbGet(`bidding_practice/${code}`).catch(() => null);
      if (!fresh || fresh.currentPos !== currentPos) { lastSeenJson = null; return; }
      await dbPut(`bidding_practice/${code}/currentPos`, currentPos + 1);
      lastSeenJson = null;
    } catch (e) {
      toast('Could not advance - try again.');
      btn.disabled = false;
    }
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

</script>
</body>
